[package]
name = "kineprism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Structurally compare UI screenshots and serve comparisons over MCP"
readme = "../../README.md"

[[bin]]
name = "kineprism"
path = "src/main.rs"

[package.metadata.npm]
name = "@zlepper/kineprism"
prefix = "@zlepper/kineprism-"
bins = ["kineprism"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
custom = { publishConfig = { access = "public" } }

[dependencies]
kineprism-core = { path = "../kineprism-core" }
clap.workspace = true
image = { workspace = true, features = ["png"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rayon.workspace = true

[lints]
workspace = true
