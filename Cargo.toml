[workspace]
members = [
    "crates/better-image-diff-cli",
    "crates/better-image-diff-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
criterion = "=0.8.2"
image = { version = "=0.25.9", default-features = false }
rayon = "1.12.0"
rmcp = { version = "3.1.4", features = ["client", "server", "transport-child-process", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["io-std", "macros", "process", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
