name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release-binaries:
    name: Build ${{ matrix.target }} release binary
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary_suffix: ""
            musl: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binary_suffix: ""
            musl: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary_suffix: ""
            musl: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary_suffix: ""
            musl: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary_suffix: ""
            musl: false
          - target: aarch64-apple-darwin
            runner: macos-15
            binary_suffix: ""
            musl: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_suffix: .exe
            musl: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary_suffix: .exe
            musl: false

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Install native musl tooling
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.musl }}" == "true" ]]; then
            target_key="${{ matrix.target }}"
            target_key="${target_key^^}"
            target_key="${target_key//-/_}"
            export "CARGO_TARGET_${target_key}_LINKER=musl-gcc"
          fi
          cargo build --locked --release --package kineprism --bin kineprism --target "${{ matrix.target }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kineprism${{ matrix.binary_suffix }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ${{ github.ref_name }}
    needs: release-binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          export EXPECTED_VERSION="$expected_version"
          actual_commit="$(git rev-parse HEAD)"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          package = next(
              (item for item in metadata["packages"] if item["name"] == "kineprism"),
              None,
          )
          if package is None:
              sys.exit("Cargo metadata did not contain the kineprism package.")
          expected = os.environ["EXPECTED_VERSION"]
          if package["version"] != expected:
              sys.exit(
                  f"Release tag v{expected} does not match Cargo version {package['version']}."
              )
          PY

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; refusing to publish it again." >&2
            exit 1
          fi

          echo "Publishing $GITHUB_REF_NAME from $actual_commit."

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Reassemble and validate release binaries
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          )

          mkdir --parents release-assets
          for target in "${targets[@]}"; do
            suffix=""
            if [[ "$target" == *-windows-* ]]; then
              suffix=".exe"
            fi

            source="downloaded-artifacts/binary-$target/kineprism$suffix"
            destination="target/$target/release/kineprism$suffix"
            if [[ ! -f "$source" ]]; then
              echo "Expected release binary is missing: $source" >&2
              exit 1
            fi

            mkdir --parents "$(dirname "$destination")"
            cp "$source" "$destination"
            cp "$source" "release-assets/kineprism-$target$suffix"
            if [[ "$suffix" != ".exe" ]]; then
              chmod +x "$destination" "release-assets/kineprism-$target$suffix"
            fi
          done

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install cargo-npm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-npm@0.1.4

      - name: Print publishing tool versions
        run: |
          node --version
          npm --version
          echo "cargo-npm 0.1.4"

      - name: Generate npm packages
        run: cargo npm generate --package kineprism --out-dir npm

      - name: Validate generated npm packages
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          export EXPECTED_VERSION
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          main_name = "@zlepper/kineprism"
          platforms = {
              "@zlepper/kineprism-linux-x64": False,
              "@zlepper/kineprism-linux-x64-musl": False,
              "@zlepper/kineprism-linux-arm64": False,
              "@zlepper/kineprism-linux-arm64-musl": False,
              "@zlepper/kineprism-darwin-x64": False,
              "@zlepper/kineprism-darwin-arm64": False,
              "@zlepper/kineprism-win32-x64": True,
              "@zlepper/kineprism-win32-arm64": True,
          }
          expected_names = {main_name, *platforms}
          packages = {}
          for manifest in Path("npm").rglob("package.json"):
              package = json.loads(manifest.read_text())
              packages[package["name"]] = (manifest.parent, package)

          if set(packages) != expected_names:
              sys.exit(
                  "Generated package names did not match the expected complete set: "
                  f"{sorted(packages)}"
              )

          expected_version = os.environ["EXPECTED_VERSION"]
          for name, (_, package) in packages.items():
              if package.get("version") != expected_version:
                  sys.exit(f"{name} has version {package.get('version')}, not {expected_version}.")
              if "zlepper/kineprism" not in json.dumps(package.get("repository", "")):
                  sys.exit(f"{name} is missing the canonical repository metadata.")

          main_directory, main = packages[main_name]
          optional = main.get("optionalDependencies", {})
          if set(optional) != set(platforms):
              sys.exit("The main package does not reference every platform package.")
          if not (main_directory / "bin" / "kineprism.js").is_file():
              sys.exit("The main package is missing the generated kineprism shim.")

          for name, is_windows in platforms.items():
              directory, _ = packages[name]
              binary = directory / ("kineprism.exe" if is_windows else "kineprism")
              if not binary.is_file():
                  sys.exit(f"{name} is missing {binary.name}.")
          PY

      - name: Publish npm packages through Trusted Publishing
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          npm_args=(--access public)
          if [[ "$expected_version" == *-* ]]; then
            prerelease="${expected_version#*-}"
            npm_args+=(--tag "${prerelease%%.*}")
          fi
          cargo npm publish -- "${npm_args[@]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
